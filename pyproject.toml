[project]
name = "albo-monitor"
version = "1.0.0"
description = "Monitor automatico dell'Albo Pretorio con report Telegram"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
