# ESEMPIO OPZIONALE: salva uno storico SQLite nel repository.
# Attenzione: in un repository pubblico potrebbe pubblicare dati raccolti dall'albo.
# Usalo solo se hai valutato privacy e conservazione dati.

name: Daily history update

"on":
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch albo and update database
        env:
          ALBO_BASE_URL: ${{ vars.ALBO_BASE_URL || 'https://comune.gualtieri.me.it/albo-pretorio' }}
          ALBO_MAX_PAGES: ${{ vars.ALBO_MAX_PAGES || '5' }}
        run: |
          mkdir -p data
          PYTHONPATH=src python -m albo_monitor.main --db data/albo.sqlite fetch --max-pages "$ALBO_MAX_PAGES"

      - name: Commit updated history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/albo.sqlite
          git commit -m "Update albo history" || echo "No changes to commit"
          git push
