name: Weekly Telegram report

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send Telegram report
        env:
          ALBO_TELEGRAM_BOT_TOKEN: ${{ secrets.ALBO_TELEGRAM_BOT_TOKEN }}
          ALBO_TELEGRAM_CHAT_ID: ${{ secrets.ALBO_TELEGRAM_CHAT_ID }}
          ALBO_MAX_PAGES: "5"
        run: PYTHONPATH=src python -m albo_monitor.main telegram-weekly
